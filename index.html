<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotmini - AI 축구 비서</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="menuBtn" class="round" type="button" aria-label="메뉴">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17"/></svg>
  </button>
  <button id="loginBtn" class="pill" type="button">로그인</button>
</header>

<main class="stage">
  <section class="hero" id="hero">
    <div class="logo">Fotmini<svg class="ball" viewBox="0 0 95 80" aria-hidden="true">
      <path d="M2 79C30 85 76 68 91 36 82 56 40 72 2 79z" fill="#c9ccd9"/>
      <circle cx="61" cy="29" r="28" fill="#fff" stroke="#16171b" stroke-width="2.6"/>
      <path d="M61 19l9.5 7-3.6 11H55.1L51.5 26z" fill="#16171b"/>
      <path d="M61 19V4M70.5 26l15.5-5M66.9 37l9 13M55.1 37l-9 13M51.5 26l-15.5-5" fill="none" stroke="#16171b" stroke-width="2.6" stroke-linecap="round"/>
    </svg></div>
    <h1>당신의 AI 축구 비서</h1>
    <p class="sub">축구에 관한 모든 것, Fotmini와 함께.</p>

    <div class="divider"><span>추천 질문</span></div>
    <div class="chips">
      <button type="button" class="chip" data-q="최근 경기를 분석해 줘">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8l3.6 2.6-1.4 4.2H9.8l-1.4-4.2z" fill="currentColor"/><path d="M12 8V2.2M15.6 10.6l5.3-1.7M14.2 14.8l3.3 4.5M9.8 14.8l-3.3 4.5M8.4 10.6L3.1 8.9"/></svg>
        <span>경기 분석해 줘</span>
      </button>
      <button type="button" class="chip" data-q="손흥민과 비슷한 선수를 비교해서 알려줘">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2.5" y="13" width="3.4" height="8" rx=".5"/><rect x="8" y="9" width="3.4" height="12" rx=".5"/><rect x="13.5" y="4" width="3.4" height="17" rx=".5"/><rect x="19" y="10" width="2.5" height="11" rx=".5"/></svg>
        <span>선수 비교해 줘</span>
      </button>
      <button type="button" class="chip" data-q="4-3-3 전술의 장단점을 분석해 줘">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5l4 4M6.5 2.5l-4 4"/><circle cx="19.5" cy="19.5" r="2.3"/><path d="M4.5 11c0 6 5 8.5 10.5 8.5" stroke-dasharray="1.8 2.6"/><path d="M12.5 11.5c-1.5-4 2-7.5 7-7.5" stroke-dasharray="1.8 2.6"/><path d="M17.6 2.2L20 4l-2.2 2.4"/></svg>
        <span>전술 분석해 줘</span>
      </button>
      <button type="button" class="chip" data-q="요즘 축구 이슈를 알려줘">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="1.5"/><path d="M6 8.5h6M6 12h12M6 15.5h12"/><rect x="14.5" y="7" width="3.5" height="3" fill="currentColor"/></svg>
        <span>축구 뉴스 알려줘</span>
      </button>
    </div>
  </section>

  <div id="chatLog" class="chat-log"></div>
</main>

<footer class="composer">
  <div class="bar">
    <button id="newBtn" class="plus" type="button" aria-label="새 대화">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3.5v17M3.5 12h17"/></svg>
    </button>
    <input id="chatInput" type="text" aria-label="질문 입력" autocomplete="off">
    <button id="chatBtn" class="send" type="button" aria-label="보내기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M21.5 2.5L2.5 10l7.5 3 3 7.5z"/><path d="M10 13L21.5 2.5"/></svg>
    </button>
  </div>
</footer>

<!-- 왼쪽에서 슬라이드로 나오는 메뉴 -->
<div id="overlay" class="overlay"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-top">
    <button id="drawerClose" class="round" type="button" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>

  <button type="button" id="drawerSettings" class="menu-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>설정</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>

  <button type="button" id="drawerNew" class="menu-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M21.5 2.5L2.5 10l7.5 3 3 7.5z"/><path d="M10 13L21.5 2.5"/></svg>
    <span>새 채팅</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>

  <!-- 시안에는 없지만 선수 도감으로 가는 길이라 넣었어요. 필요 없으면 이 버튼 전체를 지우세요 -->
  <button type="button" id="drawerDex" class="menu-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    <span>선수 도감</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>

  <div class="drawer-line"></div>

  <div class="hist-head">
    <span>채팅 기록</span>
    <button id="histClear" class="hist-clear" type="button" aria-label="채팅 기록 모두 지우기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2"/></svg>
    </button>
  </div>
  <div id="histList" class="hist-list"></div>
</aside>

<section id="dex" class="dex" hidden>
  <div class="dex-head">
    <h2>선수 도감</h2>
    <button type="button" id="dexClose" class="round small" aria-label="닫기">✕</button>
  </div>
  <div class="dex-body">
    <div class="search">
      <input id="searchInput" type="text" placeholder="예: 손흥민, 토트넘, 헤더, 독일">
      <button id="searchBtn" type="button">검색</button>
    </div>
    <div class="filters">
      <button type="button" class="filter-btn active" data-filter="ALL">전체</button>
      <button type="button" class="filter-btn" data-filter="FW">공격수</button>
      <button type="button" class="filter-btn" data-filter="MF">미드필더</button>
      <button type="button" class="filter-btn" data-filter="DF">수비수</button>
    </div>
    <div id="resultCount"></div>
    <div id="cardGrid"></div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
