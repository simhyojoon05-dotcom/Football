<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 축구 비서</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>AI 축구 비서</h1>
  <p class="lead">선수 이름, 팀, 국적, 플레이 스타일로 검색해 보세요.</p>

  <div class="search">
    <input id="searchInput" type="text" placeholder="예: 손흥민, 토트넘, 헤더, 독일">
    <button id="searchBtn" type="button">검색</button>
  </div>

   <div class="chat">
    <div id="chatLog" class="chat-log"></div>
    <div class="search">
      <input id="chatInput" type="text" placeholder="AI에게 물어보기 (예: 손흥민 같은 선수 추천해줘)">
      <button id="chatBtn" type="button">질문</button>
  <div id="resultCount"></div>
  <div id="cardGrid"></div>
</div>

<script src="script.js"></script>
</body>
</html>
